<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Alarms - Campus Security</title>

    <link rel="stylesheet" href="./css/adminlte.css">

    <style>
        th.sortable {
            cursor: pointer;
            user-select: none;
        }

        th.sortable:hover {
            background-color: rgba(0, 0, 0, 0.05);
        }

        .sort-indicator {
            margin-left: 5px;
            opacity: 0.5;
        }
    </style>
</head>

<body class="layout-fixed">

<div class="app-wrapper">

    <nav class="app-header navbar navbar-expand bg-body">
        <div class="container-fluid">

            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" data-lte-toggle="sidebar" href="#">
                        ☰
                    </a>
                </li>
            </ul>

            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <span class="nav-link">
                        Campus Security System
                    </span>
                </li>
            </ul>

        </div>
    </nav>


    <aside class="app-sidebar bg-dark shadow" data-bs-theme="dark">

        <div class="sidebar-brand">
            <a href="./index.html" class="brand-link">
                <span class="brand-text fw-light">
                    Campus Security
                </span>
            </a>
        </div>

        <div class="sidebar-wrapper">

            <nav class="mt-2">

                <ul class="nav sidebar-menu flex-column">

                    <li class="nav-item">
                        <a href="./index.html" class="nav-link">
                            <p>Dashboard</p>
                        </a>
                    </li>

                    <li class="nav-item">
                        <a href="./sensors.html" class="nav-link">
                            <p>Sensors</p>
                        </a>
                    </li>

                    <li class="nav-item">
                        <a href="./alarms.html" class="nav-link active">
                            <p>Alarms</p>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="./critical.html" class="nav-link">
                            <p>Critical Events</p>
                        </a>
                    </li>

                </ul>

            </nav>

        </div>

    </aside>


    <main class="app-main">

        <div class="app-content-header">

            <div class="container-fluid">
                <h3 class="mb-0">Alarms</h3>
            </div>

        </div>


        <div class="app-content">

            <div class="container-fluid">


               <!-- Summary -->
<div class="row mb-4">

    <div class="col-lg-3 col-6">

        <div class="small-box text-bg-danger">

            <div class="inner">
                <h3 id="active-count">0</h3>
                <p>Active Alarms</p>
            </div>

        </div>

    </div>

    <div class="col-lg-3 col-6">

        <button
            type="button"
            class="btn btn-success mt-3"
            onclick="resolveAllAlarms()"
        >
            Resolve All
        </button>

    </div>

</div>


                <!-- Filters -->
                <div class="card mb-4">

                    <div class="card-header">
                        <h3 class="card-title">
                            Search & Filters
                        </h3>
                    </div>

                    <div class="card-body">

                        <div class="row g-3">

                            <div class="col-md-3">

                                <label class="fw-semibold">
                                    Sensor ID
                                </label>

                                <input
                                    type="text"
                                    id="sensorId"
                                    class="form-control"
                                    placeholder="e.g. fire-001"
                                >

                            </div>


                            <div class="col-md-2">

                                <label class="fw-semibold">
                                    Alarm Type
                                </label>

                                <select id="alarmType" class="form-select">

                                    <option value="">
                                        All
                                    </option>

                                    <option value="fire">
                                        Fire
                                    </option>

                                    <option value="water_leak">
                                        Water Leak
                                    </option>

                                    <option value="breakin">
                                        Break-in
                                    </option>

                                </select>

                            </div>


                            <div class="col-md-2">

                                <label class="fw-semibold">
                                    Building
                                </label>

                                <input
                                    type="text"
                                    id="building"
                                    class="form-control"
                                    placeholder="Building"
                                >

                            </div>


                            <div class="col-md-2">

                                <label class="fw-semibold">
                                    Status
                                </label>

                                <select id="status" class="form-select">

                                    <option value="">
                                        All
                                    </option>

                                    <option value="active">
                                        Active
                                    </option>

                                    <option value="resolved">
                                        Resolved
                                    </option>

                                </select>

                            </div>


                            <div class="col-md-3">

                                <label class="fw-semibold">
                                    From
                                </label>

                                <input
                                    type="datetime-local"
                                    id="from"
                                    class="form-control"
                                >

                            </div>


                            <div class="col-md-3">

                                <label class="fw-semibold">
                                    To
                                </label>

                                <input
                                    type="datetime-local"
                                    id="to"
                                    class="form-control"
                                >

                            </div>

                        </div>


                        <div class="mt-3">

                            <button
                                type="button"
                                class="btn btn-primary"
                                onclick="applyFilters()"
                            >
                                Search
                            </button>

                            <button
                                type="button"
                                class="btn btn-secondary ms-2"
                                onclick="resetFilters()"
                            >
                                Reset
                            </button>

                        </div>

                    </div>

                </div>


                <!-- Alarm Table -->
                <div class="card">

                    <div class="card-header">

                        <h3 class="card-title">
                            Alarm History
                        </h3>

                        <div class="card-tools">
                            <span id="result-count">
                                Loading...
                            </span>
                        </div>

                    </div>


                    <div class="card-body p-0">

                        <div class="table-responsive">

                            <table class="table table-striped table-hover mb-0">

                                <thead>

                                    <tr>

                                        <th class="sortable" data-column="alarmType">
                                            Type
                                            <span class="sort-indicator">↕</span>
                                        </th>

                                        <th class="sortable" data-column="sensorId">
                                            Sensor ID
                                            <span class="sort-indicator">↕</span>
                                        </th>

                                        <th class="sortable" data-column="building">
                                            Building
                                            <span class="sort-indicator">↕</span>
                                        </th>

                                        <th class="sortable" data-column="location">
                                            Location
                                            <span class="sort-indicator">↕</span>
                                        </th>

                                        <th class="sortable" data-column="value">
                                            Value
                                            <span class="sort-indicator">↕</span>
                                        </th>

                                        <th class="sortable" data-column="timestamp">
                                            Timestamp
                                            <span class="sort-indicator">↓</span>
                                        </th>

                                        <th class="sortable" data-column="status">
                                            Status
                                            <span class="sort-indicator">↕</span>
                                        </th>

                                    </tr>

                                </thead>


                                <tbody id="alarms-table">

                                    <tr>
                                        <td colspan="7" class="text-center">
                                            Loading alarms...
                                        </td>
                                    </tr>

                                </tbody>

                            </table>

                        </div>

                    </div>


                    <!-- Pagination -->
                    <div class="card-footer">

                        <div class="d-flex justify-content-between align-items-center">

                            <button
                                id="previous-button"
                                class="btn btn-secondary"
                                onclick="previousPage()"
                            >
                                Previous
                            </button>


                            <span id="page-info">
                                Page 1
                            </span>


                            <button
                                id="next-button"
                                class="btn btn-secondary"
                                onclick="nextPage()"
                            >
                                Next
                            </button>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <footer class="app-footer">

        <strong>
            Campus Security System
        </strong>

    </footer>

</div>


<script src="./js/adminlte.js"></script>


<script>

let currentPage = 1;

const pageSize = 50;

let totalPages = 1;

let currentAlarms = [];

let sortColumn = "timestamp";

let sortAscending = false;


// Load alarms
async function loadAlarms() {

    const table = document.getElementById("alarms-table");

    const params = new URLSearchParams();


    const sensorId =
        document.getElementById("sensorId").value.trim();

    const alarmType =
        document.getElementById("alarmType").value;

    const building =
        document.getElementById("building").value.trim();

    const status =
        document.getElementById("status").value;

    const from =
        document.getElementById("from").value;

    const to =
        document.getElementById("to").value;


    if (sensorId) {
        params.set("sensorId", sensorId);
    }

    if (alarmType) {
        params.set("alarmType", alarmType);
    }

    if (building) {
        params.set("building", building);
    }

    if (status) {
        params.set("status", status);
    }

    if (from) {
        params.set("from", from + ":00Z");
    }

    if (to) {
        params.set("to", to + ":59Z");
    }


    params.set("page", currentPage);
    params.set("limit", pageSize);


    try {

        const response = await fetch(
            "http://localhost:3003/api/alarms?" +
            params.toString()
        );


        if (!response.ok) {
            throw new Error("API request failed");
        }


        const data = await response.json();


        currentAlarms = data.alarms || [];

        totalPages =
            data.pagination.totalPages || 1;


        renderAlarms();

        updatePagination(data.pagination);

        loadActiveAlarmCount();

    } catch (error) {

        console.error(error);

        table.innerHTML = `
            <tr>
                <td colspan="7"
                    class="text-center text-danger">
                    Unable to retrieve alarms.
                </td>
            </tr>
        `;

    }

}


// Active alarm count
async function loadActiveAlarmCount() {

    try {

        const response =
            await fetch(
                "http://localhost:3003/api/alarms/count?status=active"
            );

        if (!response.ok) {
            return;
        }

        const data = await response.json();

        document.getElementById("active-count").textContent =
            data.count;

    } catch (error) {

        console.error(error);

    }

}


// Render table
function renderAlarms() {

    const table =
        document.getElementById("alarms-table");


    let alarms =
        [...currentAlarms];


    alarms.sort((a, b) => {

        const valueA =
            getSortValue(a, sortColumn);

        const valueB =
            getSortValue(b, sortColumn);


        if (
            typeof valueA === "number" &&
            typeof valueB === "number"
        ) {

            return sortAscending
                ? valueA - valueB
                : valueB - valueA;

        }


        const stringA =
            String(valueA).toLowerCase();

        const stringB =
            String(valueB).toLowerCase();


        if (stringA < stringB) {
            return sortAscending ? -1 : 1;
        }

        if (stringA > stringB) {
            return sortAscending ? 1 : -1;
        }

        return 0;

    });


    table.innerHTML = "";


    if (alarms.length === 0) {

        table.innerHTML = `
            <tr>
                <td colspan="7"
                    class="text-center">
                    No alarms found.
                </td>
            </tr>
        `;

        return;

    }


    alarms.forEach(alarm => {

        const row =
            document.createElement("tr");


        const statusBadge =
            alarm.status === "active"
                ? `<span class="badge text-bg-danger">Active</span>`
                : `<span class="badge text-bg-success">Resolved</span>`;


        row.innerHTML = `

            <td>
                ${alarm.alarmType || "-"}
            </td>

            <td>
                ${alarm.sensorId || "-"}
            </td>

            <td>
                ${alarm.building || "-"}
            </td>

            <td>
                ${alarm.location || "-"}
            </td>

            <td>
                ${alarm.value ?? "-"}
            </td>

            <td>
                ${
                    alarm.timestamp
                        ? new Date(
                            alarm.timestamp
                        ).toLocaleString()
                        : "-"
                }
            </td>

            <td>
                ${statusBadge}

                ${
                   alarm.status === "active"
                    ? `
                           <button
                               class="btn btn-sm btn-success ms-2"
                              onclick="resolveAlarm('${alarm._id}')"
                             >
                               Resolve
                            </button>
                       `
                     : ""
                  }
            </td>

        `;


        table.appendChild(row);

    });


    updateSortIndicators();

}

async function resolveAlarm(alarmId) {

    if (!confirm("Mark this alarm as resolved?")) {
        return;
    }

    try {

        const response = await fetch(
            `http://localhost:3003/api/alarms/${alarmId}/resolve`,
            {
                method: "PATCH"
            }
        );

        if (!response.ok) {
            throw new Error("Failed to resolve alarm");
        }

        // Reload the current page
        loadAlarms();

    } catch (error) {

        console.error(error);

        alert("Unable to resolve alarm.");

    }
}

async function resolveAllAlarms() {

    if (!confirm("Mark all active alarms as resolved?")) {
        return;
    }

    try {

        const response = await fetch(
            "http://localhost:3003/api/alarms?status=active&limit=200"
        );

        if (!response.ok) {
            throw new Error("Failed to retrieve active alarms");
        }

        const data = await response.json();

        const alarms = data.alarms || [];

        for (const alarm of alarms) {

            const resolveResponse = await fetch(
                `http://localhost:3003/api/alarms/${alarm._id}/resolve`,
                {
                    method: "PATCH"
                }
            );

            if (!resolveResponse.ok) {
                throw new Error(
                    `Failed to resolve alarm ${alarm._id}`
                );
            }
        }

        loadAlarms();

    } catch (error) {

        console.error(error);

        alert("Unable to resolve all alarms.");

    }
}

// Sort values
function getSortValue(alarm, column) {

    switch (column) {

        case "alarmType":
            return alarm.alarmType || "";

        case "sensorId":
            return alarm.sensorId || "";

        case "building":
            return alarm.building || "";

        case "location":
            return alarm.location || "";

        case "value":
            return alarm.value ?? -Infinity;

        case "timestamp":
            return alarm.timestamp
                ? new Date(alarm.timestamp).getTime()
                : 0;

        case "status":
            return alarm.status || "";

        default:
            return "";

    }

}


// Sorting
document.querySelectorAll("th.sortable").forEach(header => {

    header.addEventListener("click", () => {

        const column =
            header.dataset.column;


        if (sortColumn === column) {

            sortAscending =
                !sortAscending;

        } else {

            sortColumn = column;

            sortAscending = true;

        }


        renderAlarms();

    });

});


// Sort indicators
function updateSortIndicators() {

    document.querySelectorAll("th.sortable").forEach(header => {

        const indicator =
            header.querySelector(".sort-indicator");


        if (
            header.dataset.column ===
            sortColumn
        ) {

            indicator.textContent =
                sortAscending ? "↑" : "↓";

            indicator.style.opacity = "1";

        } else {

            indicator.textContent = "↕";

            indicator.style.opacity = "0.5";

        }

    });

}


// Filters
function applyFilters() {

    currentPage = 1;

    loadAlarms();

}


function resetFilters() {

    document.getElementById("sensorId").value = "";

    document.getElementById("alarmType").value = "";

    document.getElementById("building").value = "";

    document.getElementById("status").value = "";

    document.getElementById("from").value = "";

    document.getElementById("to").value = "";

    currentPage = 1;

    loadAlarms();

}


// Pagination
function previousPage() {

    if (currentPage > 1) {

        currentPage--;

        loadAlarms();

    }

}


function nextPage() {

    if (currentPage < totalPages) {

        currentPage++;

        loadAlarms();

    }

}


// Pagination UI
function updatePagination(pagination) {

    const pages =
        pagination.totalPages || 1;


    document.getElementById("page-info").textContent =
        `Page ${pagination.page} of ${pages}`;


    document.getElementById("result-count").textContent =
        `${pagination.total} alarms`;


    document.getElementById("previous-button").disabled =
        pagination.page <= 1;


    document.getElementById("next-button").disabled =
        pagination.page >= pages;

}


loadAlarms();

</script>

</body>

</html>
