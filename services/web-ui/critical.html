<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Critical Events - Campus Security</title>

    <link
        rel="stylesheet"
        href="./css/adminlte.css">

    <link
        rel="stylesheet"
        href="./assets/css/campus.css">

</head>

<body class="layout-fixed">

<div class="app-wrapper">

    <!-- Header -->
    <nav class="app-header navbar navbar-expand bg-body">

        <div class="container-fluid">

            <ul class="navbar-nav">

                <li class="nav-item">

                    <a
                        class="nav-link"
                        data-lte-toggle="sidebar"
                        href="#">

                        ☰

                    </a>

                </li>

            </ul>

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">

                    <span class="nav-link">
                        Campus Security System
                    </span>

                </li>

            </ul>

        </div>

    </nav>


    <!-- Sidebar -->
    <aside
        class="app-sidebar bg-dark shadow"
        data-bs-theme="dark">

        <div class="sidebar-brand">

            <a
                href="./index.html"
                class="brand-link">

                <span class="brand-text fw-light">
                    Campus Security
                </span>

            </a>

        </div>


        <div class="sidebar-wrapper">

            <nav class="mt-2">

                <ul class="nav sidebar-menu flex-column">

                    <li class="nav-item">

                        <a
                            href="./index.html"
                            class="nav-link">

                            <p>Dashboard</p>

                        </a>

                    </li>


                    <li class="nav-item">

                        <a
                            href="./sensors.html"
                            class="nav-link">

                            <p>Sensors</p>

                        </a>

                    </li>

                    <li class="nav-item">

                        <a
                            href="./alarms.html"
                            class="nav-link">

                            <p>Alarms</p>

                        </a>

                    </li>


                    <li class="nav-item">

                        <a
                            href="./critical.html"
                            class="nav-link active">

                            <p>Critical Events</p>

                        </a>

                    </li>

                </ul>

            </nav>

        </div>

    </aside>


    <!-- Main Content -->
    <main class="app-main">

        <div class="app-content-header">

            <div class="container-fluid">

                <div class="row">

                    <div class="col-sm-6">

                        <h3 class="mb-0">
                            Critical Events
                        </h3>

                    </div>

                </div>

            </div>

        </div>


        <div class="app-content">

            <div class="container-fluid">

                <div class="card">

                    <div class="card-header">

                        <h3 class="card-title">
                            Sensor Critical Events
                        </h3>

                    </div>


                    <div class="card-body p-0">

                        <div class="table-responsive">

                            <table
                                class="table table-hover mb-0">

                                <thead>

                                    <tr>

                                        <th>
                                            Sensor
                                        </th>

                                        <th>
                                            Last Reading
                                        </th>

                                        <th>
                                            Detected
                                        </th>

                                        <th>
                                            Action
                                        </th>

                                    </tr>

                                </thead>


                                <tbody
                                    id="critical-events-table">

                                    <tr>

                                        <td
                                            colspan="4"
                                            class="text-center">

                                            Loading...

                                        </td>

                                    </tr>

                                </tbody>

                            </table>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>

</div>


<script src="./js/adminlte.js"></script>


<script>

async function loadCriticalEvents() {

    const table =
        document.getElementById(
            "critical-events-table"
        );

    try {

        const response =
            await fetch(
                "http://localhost:3003/api/critical-events"
            );

        if (!response.ok) {

            throw new Error(
                "Failed to retrieve critical events"
            );

        }

        const events =
            await response.json();


        if (events.length === 0) {

            table.innerHTML = `

                <tr>

                    <td
                        colspan="4"
                        class="text-center">

                        No critical events.

                    </td>

                </tr>

            `;

            return;

        }


        table.innerHTML = "";


        events.forEach(event => {

            const row =
                document.createElement("tr");


            row.innerHTML = `

                <td>

                    <strong>
                        ${event.sensorId || "-"}
                    </strong>

                </td>


                <td>

                    ${
                        event.lastReadingTime
                            ? new Date(
                                event.lastReadingTime
                              ).toLocaleString()
                            : "-"
                    }

                </td>


                <td>

                    ${
                        event.timestamp
                            ? new Date(
                                event.timestamp
                              ).toLocaleString()
                            : "-"
                    }

                </td>


                <td>

                    <button
                        class="btn btn-success btn-sm"
                        onclick="resolveCriticalEvent('${event._id}')">

                        Resolve

                    </button>

                </td>

            `;


            table.appendChild(row);

        });


    } catch (error) {

        console.error(
            "Critical Events error:",
            error
        );


        table.innerHTML = `

            <tr>

                <td
                    colspan="4"
                    class="text-center text-danger">

                    Unable to retrieve critical events.

                </td>

            </tr>

        `;

    }

}


async function resolveCriticalEvent(id) {

    try {

        const response =
            await fetch(
                `http://localhost:3003/api/critical-events/${id}/resolve`,
                {
                    method: "PATCH"
                }
            );

        if (!response.ok) {

            throw new Error(
                "Failed to resolve critical event"
            );

        }

        await loadCriticalEvents();

    } catch (error) {

        console.error(
            "Resolve critical event error:",
            error
        );

        alert(
            "Failed to resolve critical event."
        );

    }

}


loadCriticalEvents();


setInterval(
    loadCriticalEvents,
    10000
);

</script>

</body>

</html>
