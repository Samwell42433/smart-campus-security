    <link

</head>

<div class="app-wrapper">

    <!-- Header -->

        <div class="container-fluid">

            <ul class="navbar-nav">

                <li class="nav-item">

                    <a
                        class="nav-link"
                        data-lte-toggle="sidebar"
                        href="#">

                        ☰

                    </a>

                </li>

            </ul>

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">

                    <span class="nav-link">
                        Campus Security System
                    </span>

                </li>

            </ul>

        </div>

    </nav>


    <!-- Sidebar -->
    <aside
        class="app-sidebar bg-dark shadow"
        data-bs-theme="dark">

        <div class="sidebar-brand">

            <a
                href="./index.html"
                class="brand-link">

                <span class="brand-text fw-light">
                    Campus Security
                </span>

            </a>

        </div>


        <div class="sidebar-wrapper">

            <nav class="mt-2">

                <ul class="nav sidebar-menu flex-column">

                    <li class="nav-item">

                        <a
                            href="./index.html"
                            class="nav-link">

                            <p>Dashboard</p>

                        </a>

                    </li>


                    <li class="nav-item">

                        <a
                            href="./sensors.html"
                            class="nav-link active">

                            <p>Sensors</p>

                        </a>

                    </li>


                    <li class="nav-item">

                        <a
                            href="./alarms.html"

                    </li>


                    <li class="nav-item">

                        <a
                            href="./critical.html"
                            class="nav-link">

                        </a>

                    </li>

                </ul>

            </nav>

        </div>

    </aside>


    <!-- Main -->
    <main class="app-main">

        <div class="app-content-header">

            <div class="container-fluid">

                <div class="row">

                    <div class="col-sm-6">

                        <h3 class="mb-0">
                            Sensors
                        </h3>

                    </div>

                </div>

            </div>

        </div>


        <div class="app-content">

            <div class="container-fluid">

                <div class="card">

                    <div class="card-header">

                        <h3 class="card-title">
                            Campus Sensors
                        </h3>

                    </div>


                    <div class="card-body">

                        <div
                            id="sensors-container"
                            class="table-responsive">

                            Loading...

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>

</div>


<script src="./js/adminlte.js"></script>


<script>

async function loadSensors() {

    const container =
        document.getElementById(
            "sensors-container"
        );

    try {

        const response =
            await fetch(
                "http://localhost:3003/api/sensors"
            );

        if (!response.ok) {

            throw new Error(
                "Failed to retrieve sensors"
            );

        }

        let sensors =
            await response.json();


        const criticalEventsResponse =
            await fetch(
                "http://localhost:3003/api/critical-events"
            );

        const criticalEvents =
            await criticalEventsResponse.json();


        sensors =
            sensors.map(sensor => {

                const criticalEvent =
                    criticalEvents.find(
                        event =>
                            event.sensorId ===
                            sensor.sensorId
                    );

                return {
                    ...sensor,
                    criticalEvent
                };

            });


        let html = `

            <table class="table table-hover">

                <thead>

                    <tr>

                        <th>Sensor</th>
                        <th>Type</th>
                        <th>Building</th>
                        <th>Location</th>
                        <th>Last Reading</th>
                        <th>Status</th>

                    </tr>

                </thead>

                <tbody>

        `;


        sensors.forEach(sensor => {

            const statusClass =
                sensor.status === "inactive"
                    ? "danger"
                    : "success";


            html += `

                <tr>

                    <td>
                        <strong>
                            ${sensor.sensorId}
                        </strong>

                        ${
                            sensor.status === "inactive" &&
                            sensor.criticalEvent
                                ? `<br>
                                    <a
                                        href="./critical.html"
                                        class="text-danger">
                                        Critical event: ${
                                            new Date(
                                                sensor.criticalEvent.timestamp
                                            ).toLocaleString()
                                        }
                                    </a>`
                                : ""
                            }

                    </td>

                    <td>
                        ${sensor.type || "-"}
                    </td>


                    <td>
                        ${sensor.building || "-"}
                    </td>


                    <td>
                        ${sensor.location || "-"}
                    </td>


                    <td>

                        ${
                            sensor.lastReadingTime
                                ? new Date(
                                    sensor.lastReadingTime
                                  ).toLocaleString()
                                : "-"
                        }

                    </td>


                    <td>

                        <span
                            class="badge text-bg-${statusClass}">

                            ${
                                sensor.status ||
                                "active"
                            }

                        </span>

                    </td>

                </tr>

            `;

        });


        html += `

                </tbody>

            </table>

        `;


        container.innerHTML = html;


    } catch (error) {

        console.error(
            "Sensors error:",
            error
        );

        container.innerHTML = `

            <div class="text-danger">

                Unable to retrieve sensors.

            </div>

        `;

    }

}


loadSensors();


setInterval(
    loadSensors,
    10000
);

</script>

</body>

</html>
